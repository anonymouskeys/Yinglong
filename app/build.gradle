plugins {
    id 'com.android.application'
}

android {
    namespace 'org.yinglong.client'
    compileSdk 35

    defaultConfig {
        applicationId 'org.yinglong.client'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
