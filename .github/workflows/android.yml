name: Build Android APK

on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned OpenVPN Android backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party
          URL="https://raw.githubusercontent.com/mysteriumnetwork/openvpn_dart/7ac4d91f5e401f2802c6942dcb868a476236cdcd/android/localmaven/network/mysterium/openvpn/icsopenvpn/0.7.55-myst/icsopenvpn-0.7.55-myst.aar"
          curl --fail --location --retry 3 --connect-timeout 20 "$URL" \
            -o third_party/icsopenvpn-0.7.55-myst.aar
          echo "1da7a6068d0bda22fef4b8ec7a887c07ab456e65c1246ea9a7533c4676891454  third_party/icsopenvpn-0.7.55-myst.aar" \
            | sha256sum -c -

      - name: Fetch pinned SoftEther Android engine
        shell: bash
        run: |
          set -euo pipefail
          PIN="fc0140212c0111ed93b95243c4d04711a9a0a019"
          rm -rf third_party/SoftEtherClient
          mkdir -p third_party/SoftEtherClient
          git -C third_party/SoftEtherClient init
          git -C third_party/SoftEtherClient remote add origin https://github.com/hoang-rio/SoftEther-Android-Module.git
          git -C third_party/SoftEtherClient fetch --depth 1 origin "$PIN"
          git -C third_party/SoftEtherClient checkout --detach FETCH_HEAD
          test "$(git -C third_party/SoftEtherClient rev-parse HEAD)" = "$PIN"

          git -C third_party/SoftEtherClient submodule update --init --depth 1 src/main/cpp/openssl

          python3 - <<'PY'
          from pathlib import Path
          p = Path("third_party/SoftEtherClient/build.gradle")
          s = p.read_text()
          s = s.replace(
              "plugins {\n    id 'com.android.library'\n}",
              "plugins {\n    id 'com.android.library'\n    id 'org.jetbrains.kotlin.android'\n}"
          )
          s = s.replace(
              "implementation 'androidx.core:core-ktx:1.18.0'",
              "implementation 'androidx.core:core-ktx:1.13.1'"
          )
          p.write_text(s)
          PY

      - name: Patch SoftEther native core for Android
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_softether_module.py third_party/SoftEtherClient
          grep -q 'ssl_write_all_control' third_party/SoftEtherClient/src/main/cpp/softether-core/src/proto/softether_protocol.c
          grep -q 'conn->forced_auth_type = -1' third_party/SoftEtherClient/src/main/cpp/softether-core/src/proto/softether_protocol.c

      - name: Fetch pinned MS-SSTP Android engine
        shell: bash
        run: |
          set -euo pipefail
          PIN="f14e33a28e04ab17885acb2f60f972791dd6438b"
          rm -rf third_party/sstpClient
          mkdir -p third_party/sstpClient
          git -C third_party/sstpClient init
          git -C third_party/sstpClient remote add origin https://github.com/hoang-rio/Open-SSTP-Client.git
          git -C third_party/sstpClient fetch --depth 1 origin "$PIN"
          git -C third_party/sstpClient checkout --detach FETCH_HEAD
          test "$(git -C third_party/sstpClient rev-parse HEAD)" = "$PIN"
          python3 scripts/patch_sstp_module.py third_party/sstpClient

      - name: Generate OpenSSL headers for SoftEther
        shell: bash
        run: |
          set -euo pipefail
          bash third_party/SoftEtherClient/src/main/cpp/build-openssl-android.sh --headers-only
          test -f third_party/SoftEtherClient/src/main/cpp/openssl/include/openssl/configuration.h

      - name: Refresh bundled VPN Gate relay seed
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/update_seed.sh

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify VPN engine packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libsoftether.so' /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libovpnexec.so' /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libovpn3.so' /tmp/apk-list.txt

          MANIFEST="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E 'merged_manifest|merged_manifests' | head -n 1 || true)"
          if [ -z "$MANIFEST" ]; then
            echo "Merged manifest not found" >&2
            exit 1
          fi
          echo "Checking merged manifest: $MANIFEST"
          grep -q 'vn.unlimit.softether.SoftEtherVpnService' "$MANIFEST"
          grep -q 'kittoku.osc.service.SstpVpnService' "$MANIFEST"
          grep -q 'android.permission.BIND_VPN_SERVICE' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$MANIFEST"
          echo "SoftEther + OpenVPN3 engine packaging checks passed"

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Yinglong-debug.apk
          sha256sum dist/Yinglong-debug.apk | tee dist/Yinglong-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yinglong-debug-apk
          path: |
            dist/Yinglong-debug.apk
            dist/Yinglong-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
