name: Build Android APK

on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned OpenVPN Android backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party
          URL="https://raw.githubusercontent.com/mysteriumnetwork/openvpn_dart/7ac4d91f5e401f2802c6942dcb868a476236cdcd/android/localmaven/network/mysterium/openvpn/icsopenvpn/0.7.55-myst/icsopenvpn-0.7.55-myst.aar"
          curl --fail --location --retry 3 --connect-timeout 20 "$URL" \
            -o third_party/icsopenvpn-0.7.55-myst.aar
          echo "1da7a6068d0bda22fef4b8ec7a887c07ab456e65c1246ea9a7533c4676891454  third_party/icsopenvpn-0.7.55-myst.aar" \
            | sha256sum -c -

      - name: Fetch Android shell + exact official SoftEther core
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/SoftEtherClient
          git clone --filter=blob:none https://github.com/hoang-rio/SoftEther-Android-Module.git third_party/SoftEtherClient
          git -C third_party/SoftEtherClient checkout --detach fc0140212c0111ed93b95243c4d04711a9a0a019
          test "$(git -C third_party/SoftEtherClient rev-parse HEAD)" = "fc0140212c0111ed93b95243c4d04711a9a0a019"
          git -C third_party/SoftEtherClient submodule update --init --depth 1 src/main/cpp/openssl

          # Upstream Android shell has Kotlin sources and a kotlin { } block,
          # but applies only com.android.library. Yinglong root already provides
          # org.jetbrains.kotlin.android 2.0.21, so apply it before evaluation.
          python3 - <<'PYGRADLE'
          from pathlib import Path
          p = Path("third_party/SoftEtherClient/build.gradle")
          s = p.read_text()

          if "id 'org.jetbrains.kotlin.android'" not in s:
              old = "plugins {\n    id 'com.android.library'\n}"
              new = "plugins {\n    id 'com.android.library'\n    id 'org.jetbrains.kotlin.android'\n}"
              if old not in s:
                  raise SystemExit("SoftEtherClient plugins block not found")
              s = s.replace(old, new, 1)

          s = s.replace(
              "implementation 'androidx.core:core-ktx:1.18.0'",
              "implementation 'androidx.core:core-ktx:1.13.1'"
          )

          p.write_text(s)

          if "id 'org.jetbrains.kotlin.android'" not in s:
              raise SystemExit("Kotlin Android plugin patch failed")
          PYGRADLE

          rm -rf third_party/SoftEtherClient/src/main/cpp/official
          mkdir -p third_party/SoftEtherClient/src/main/cpp/official
          git clone --filter=blob:none https://github.com/SoftEtherVPN/SoftEtherVPN_Stable.git \
            third_party/SoftEtherClient/src/main/cpp/official/SoftEtherVPN
          git -C third_party/SoftEtherClient/src/main/cpp/official/SoftEtherVPN \
            checkout --detach ed17437af9719ac66acab30faa29e375d613c35f
          test "$(git -C third_party/SoftEtherClient/src/main/cpp/official/SoftEtherVPN rev-parse HEAD)" \
            = "ed17437af9719ac66acab30faa29e375d613c35f"

          rm -rf /tmp/softether-android-buildref
          git clone --filter=blob:none https://github.com/ameerhassan/softethervpn-android.git \
            /tmp/softether-android-buildref
          git -C /tmp/softether-android-buildref checkout --detach \
            33044e4e21d24febf086774a89a79ce7914b76f1

          CPP=third_party/SoftEtherClient/src/main/cpp
          REF=/tmp/softether-android-buildref/app/src/main/cpp
          rm -rf "$CPP/iconv" "$CPP/ncurses" "$CPP/readline" "$CPP/include"
          cp -a "$REF/iconv" "$CPP/iconv"
          cp -a "$REF/ncurses" "$CPP/ncurses"
          cp -a "$REF/readline" "$CPP/readline"
          cp -a "$REF/include" "$CPP/include"
          cp "$REF/tools.cmake" "$CPP/tools.cmake"
          cp "$REF/iconv.cmake" "$CPP/iconv.cmake"
          cp "$REF/ncurses.cmake" "$CPP/ncurses.cmake"
          cp "$REF/readline.cmake" "$CPP/readline.cmake"

          # Fix readline definitions without YAML heredocs.
          # target_compile_definitions() already adds -D itself.
          sed -i 's/        -DHAVE_CONFIG_H/        HAVE_CONFIG_H/' "$CPP/readline.cmake"
          sed -i 's/        -DREADLINE_LIBRARY/        READLINE_LIBRARY/' "$CPP/readline.cmake"
          sed -i 's@        -DRL_LIBRARY_VERSION='\''"8.0"'\''@        RL_LIBRARY_VERSION=\\"8.0\\"@' "$CPP/readline.cmake"

          grep -Fq 'RL_LIBRARY_VERSION=\"8.0\"' "$CPP/readline.cmake"
          ! grep -Fq -- '-DRL_LIBRARY_VERSION=' "$CPP/readline.cmake"

          mkdir -p "$CPP/official_android"
          cp official_softether/CMakeLists.txt "$CPP/CMakeLists.txt"
          cp official_softether/android_official_jni.c \
            "$CPP/official_android/android_official_jni.c"

          python3 official_softether/patch_official_android.py \
            "$CPP/official/SoftEtherVPN"
          python3 official_softether/patch_android_shell.py \
            third_party/SoftEtherClient

          test -z "$(git -C "$CPP/official/SoftEtherVPN" diff --name-only -- \
            src/Cedar/Protocol.c src/Cedar/Connection.c src/Cedar/Session.c \
            src/Mayaqua/Network.c src/Mayaqua/Encrypt.c src/Mayaqua/Pack.c)"

          grep -q "id 'org.jetbrains.kotlin.android'" third_party/SoftEtherClient/build.gradle
          grep -q "androidx.core:core-ktx:1.13.1" third_party/SoftEtherClient/build.gradle
          ! grep -q 'softether-core/src/proto' "$CPP/CMakeLists.txt"
          grep -q 'cedar_official' "$CPP/CMakeLists.txt"
          grep -Fq 'RL_LIBRARY_VERSION=\"8.0\"' "$CPP/readline.cmake"
          grep -q 'NewClientSession' "$CPP/official_android/android_official_jni.c"

      - name: Fetch pinned MS-SSTP Android engine
        shell: bash
        run: |
          set -euo pipefail
          PIN="f14e33a28e04ab17885acb2f60f972791dd6438b"
          rm -rf third_party/sstpClient
          mkdir -p third_party/sstpClient
          git -C third_party/sstpClient init
          git -C third_party/sstpClient remote add origin https://github.com/hoang-rio/Open-SSTP-Client.git
          git -C third_party/sstpClient fetch --depth 1 origin "$PIN"
          git -C third_party/sstpClient checkout --detach FETCH_HEAD
          test "$(git -C third_party/sstpClient rev-parse HEAD)" = "$PIN"
          python3 scripts/patch_sstp_module.py third_party/sstpClient

      - name: Generate OpenSSL headers for SoftEther
        shell: bash
        run: |
          set -euo pipefail
          bash third_party/SoftEtherClient/src/main/cpp/build-openssl-android.sh --headers-only
          test -f third_party/SoftEtherClient/src/main/cpp/openssl/include/openssl/configuration.h

      - name: Refresh bundled VPN Gate relay seed
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/update_seed.sh

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify VPN engine packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libsoftether.so' /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libovpnexec.so' /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libovpn3.so' /tmp/apk-list.txt

          MANIFEST="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E 'merged_manifest|merged_manifests' | head -n 1 || true)"
          if [ -z "$MANIFEST" ]; then
            echo "Merged manifest not found" >&2
            exit 1
          fi
          echo "Checking merged manifest: $MANIFEST"
          grep -q 'vn.unlimit.softether.SoftEtherVpnService' "$MANIFEST"
          grep -q 'kittoku.osc.service.SstpVpnService' "$MANIFEST"
          grep -q 'android.permission.BIND_VPN_SERVICE' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$MANIFEST"
          echo "SoftEther + OpenVPN3 engine packaging checks passed"

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Yinglong-debug.apk
          sha256sum dist/Yinglong-debug.apk | tee dist/Yinglong-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yinglong-debug-apk
          path: |
            dist/Yinglong-debug.apk
            dist/Yinglong-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
