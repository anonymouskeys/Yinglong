name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned OpenVPN Android backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party
          URL="https://raw.githubusercontent.com/mysteriumnetwork/openvpn_dart/7ac4d91f5e401f2802c6942dcb868a476236cdcd/android/localmaven/network/mysterium/openvpn/icsopenvpn/0.7.55-myst/icsopenvpn-0.7.55-myst.aar"
          curl --fail --location --retry 3 --connect-timeout 20 "$URL" \
            -o third_party/icsopenvpn-0.7.55-myst.aar
          echo "1da7a6068d0bda22fef4b8ec7a887c07ab456e65c1246ea9a7533c4676891454  third_party/icsopenvpn-0.7.55-myst.aar" \
            | sha256sum -c -

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Yinglong-debug.apk
          sha256sum dist/Yinglong-debug.apk | tee dist/Yinglong-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yinglong-debug-apk
          path: |
            dist/Yinglong-debug.apk
            dist/Yinglong-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
